<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BetterGI Remote Control</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #1a1a1a;
            color: #e0e0e0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            margin-bottom: 30px;
            color: #fff;
        }
        .status-box {
            background: #2a2a2a;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }
        .status-indicator.running { background: #4caf50; }
        .status-indicator.stopped { background: #f44336; }
        .status-indicator.unknown { background: #9e9e9e; }
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }
        button {
            flex: 1;
            padding: 15px;
            font-size: 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }
        button.start {
            background: #4caf50;
            color: white;
        }
        button.start:hover {
            background: #45a049;
        }
        button.stop {
            background: #f44336;
            color: white;
        }
        button.stop:hover {
            background: #da190b;
        }
        button.refresh {
            background: #2196f3;
            color: white;
        }
        button.refresh:hover {
            background: #0b7dda;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .tasks {
            background: #2a2a2a;
            border-radius: 8px;
            padding: 20px;
        }
        .task-item {
            border-bottom: 1px solid #3a3a3a;
            padding: 10px 0;
        }
        .task-item:last-child {
            border-bottom: none;
        }
        .task-type {
            font-weight: bold;
            text-transform: uppercase;
            color: #2196f3;
        }
        .task-status {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 3px;
            font-size: 12px;
            margin-left: 10px;
        }
        .task-status.completed {
            background: #4caf50;
            color: white;
        }
        .task-status.failed {
            background: #f44336;
            color: white;
        }
        .task-status.running {
            background: #ff9800;
            color: white;
        }
        .message {
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: none;
        }
        .message.error {
            background: #f443361a;
            border: 1px solid #f44336;
            color: #f44336;
        }
        .message.success {
            background: #4caf501a;
            border: 1px solid #4caf50;
            color: #4caf50;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 BetterGI Remote Control</h1>

        <div id="message" class="message"></div>

        <div class="status-box">
            <h3>状态</h3>
            <p>
                <span id="status-indicator" class="status-indicator unknown"></span>
                <span id="status-text">正在获取...</span>
            </p>
            <p style="margin-top: 10px; color: #888; font-size: 14px;">
                BetterGI: <code id="bettergi-url">{{ .bettergiURL }}</code>
            </p>
        </div>

        <div class="controls">
            <button class="start" onclick="startTask()">▶ 启动任务</button>
            <button class="stop" onclick="stopTask()">⏹ 停止任务</button>
            <button class="refresh" onclick="refreshStatus()">🔄 刷新状态</button>
        </div>

        <div class="tasks">
            <h3>最近任务</h3>
            <div id="task-list">加载中...</div>
        </div>
    </div>

    <script>
        const API_BASE = '/admin';

        function showMessage(text, type) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.className = `message ${type}`;
            msg.style.display = 'block';
            setTimeout(() => {
                msg.style.display = 'none';
            }, 5000);
        }

        async function refreshStatus() {
            try {
                const res = await fetch(`${API_BASE}/status`);
                const data = await res.json();

                const indicator = document.getElementById('status-indicator');
                const text = document.getElementById('status-text');

                if (data.running) {
                    indicator.className = 'status-indicator running';
                    text.textContent = '运行中';
                } else {
                    indicator.className = 'status-indicator stopped';
                    text.textContent = '已停止';
                }
            } catch (err) {
                document.getElementById('status-indicator').className = 'status-indicator unknown';
                document.getElementById('status-text').textContent = '无法连接';
                showMessage('获取状态失败: ' + err.message, 'error');
            }
        }

        async function startTask() {
            try {
                const res = await fetch(`${API_BASE}/start`, { method: 'POST' });
                const data = await res.json();

                if (res.ok) {
                    showMessage('任务已启动', 'success');
                    await refreshStatus();
                    await loadTasks();
                } else {
                    showMessage('启动失败: ' + (data.error || '未知错误'), 'error');
                }
            } catch (err) {
                showMessage('启动失败: ' + err.message, 'error');
            }
        }

        async function stopTask() {
            try {
                const res = await fetch(`${API_BASE}/stop`, { method: 'POST' });
                const data = await res.json();

                if (res.ok) {
                    showMessage('任务已停止', 'success');
                    await refreshStatus();
                    await loadTasks();
                } else {
                    showMessage('停止失败: ' + (data.error || '未知错误'), 'error');
                }
            } catch (err) {
                showMessage('停止失败: ' + err.message, 'error');
            }
        }

        async function loadTasks() {
            try {
                const res = await fetch(`${API_BASE}/tasks`);
                const data = await res.json();

                const list = document.getElementById('task-list');
                if (!data.tasks || data.tasks.length === 0) {
                    list.innerHTML = '<p style="color: #888;">暂无任务</p>';
                    return;
                }

                list.innerHTML = data.tasks.map(task => `
                    <div class="task-item">
                        <span class="task-type">${task.Type}</span>
                        <span class="task-status ${task.Status}">${task.Status}</span>
                        <span style="color: #888; font-size: 12px; margin-left: 10px;">
                            ${new Date(task.CreatedAt).toLocaleString()}
                        </span>
                        ${task.Result ? `<p style="margin-top: 5px; color: #bbb; font-size: 13px;">${task.Result}</p>` : ''}
                    </div>
                `).join('');
            } catch (err) {
                document.getElementById('task-list').innerHTML = '<p style="color: #f44336;">加载失败</p>';
            }
        }

        // 初始化
        refreshStatus();
        loadTasks();

        // 自动刷新
        setInterval(() => {
            refreshStatus();
            loadTasks();
        }, 5000);
    </script>
</body>
</html>
