<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BetterGI Remote Control</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 24px 32px;
            margin-bottom: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 28px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border-radius: 24px;
            font-size: 14px;
            font-weight: 600;
        }

        .status-badge.running {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .status-badge.stopped {
            background: #ffebee;
            color: #c62828;
        }

        .status-badge.loading {
            background: #fff3e0;
            color: #ef6c00;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        .status-dot.running {
            background: #4caf50;
        }

        .status-dot.stopped {
            background: #f44336;
        }

        .status-dot.loading {
            background: #ff9800;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 24px;
            margin-bottom: 24px;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.15);
        }

        .card h2 {
            font-size: 18px;
            margin-bottom: 16px;
            color: #333;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-icon {
            width: 24px;
            height: 24px;
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }

        button {
            padding: 12px 20px;
            font-size: 15px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        button.primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        button.primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        button.success {
            background: #4caf50;
            color: white;
        }

        button.success:hover:not(:disabled) {
            background: #45a049;
        }

        button.danger {
            background: #f44336;
            color: white;
        }

        button.danger:hover:not(:disabled) {
            background: #da190b;
        }

        button.secondary {
            background: #e0e0e0;
            color: #333;
        }

        button.secondary:hover:not(:disabled) {
            background: #d0d0d0;
        }

        .screenshot-container {
            grid-column: 1 / -1;
        }

        .screenshot-box {
            width: 100%;
            background: #f5f5f5;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            min-height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .screenshot-box img {
            max-width: 100%;
            height: auto;
            display: block;
        }

        .screenshot-placeholder {
            color: #999;
            font-size: 14px;
        }

        .select-box {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 12px;
            background: white;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .select-box:hover {
            border-color: #667eea;
        }

        .select-box:focus {
            outline: none;
            border-color: #667eea;
        }

        .task-list {
            max-height: 400px;
            overflow-y: auto;
        }

        .task-item {
            padding: 12px;
            border-bottom: 1px solid #f0f0f0;
            transition: background 0.2s;
        }

        .task-item:hover {
            background: #f9f9f9;
        }

        .task-item:last-child {
            border-bottom: none;
        }

        .task-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }

        .task-type {
            font-weight: 600;
            color: #667eea;
            text-transform: uppercase;
            font-size: 13px;
        }

        .task-status {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .task-status.completed {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .task-status.failed {
            background: #ffebee;
            color: #c62828;
        }

        .task-status.running {
            background: #fff3e0;
            color: #ef6c00;
        }

        .task-time {
            color: #999;
            font-size: 12px;
        }

        .task-result {
            margin-top: 8px;
            padding: 8px;
            background: #f5f5f5;
            border-radius: 4px;
            font-size: 13px;
            color: #666;
            max-height: 100px;
            overflow-y: auto;
        }

        .message {
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 24px;
            display: none;
            animation: slideIn 0.3s;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.error {
            background: #ffebee;
            color: #c62828;
            border-left: 4px solid #f44336;
        }

        .message.success {
            background: #e8f5e9;
            color: #2e7d32;
            border-left: 4px solid #4caf50;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }

        .empty-state svg {
            width: 64px;
            height: 64px;
            margin-bottom: 16px;
            opacity: 0.3;
        }

        /* Scrollbar styles */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #555;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }

            .header {
                flex-direction: column;
                gap: 16px;
                align-items: flex-start;
            }

            .controls {
                grid-template-columns: 1fr;
            }
        }

        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            display: inline-block;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎮 BetterGI Remote Control</h1>
            <div id="status-badge" class="status-badge loading">
                <span class="status-dot loading"></span>
                <span>正在连接...</span>
            </div>
        </div>

        <div id="message" class="message"></div>

        <div class="grid">
            <!-- 基础控制 -->
            <div class="card">
                <h2>
                    <span class="card-icon">⚡</span>
                    基础控制
                </h2>
                <div class="controls">
                    <button class="success" onclick="startTask()">
                        ▶ 启动
                    </button>
                    <button class="danger" onclick="stopTask()">
                        ⏹ 停止
                    </button>
                </div>
                <button class="secondary" style="width: 100%;" onclick="refreshStatus()">
                    🔄 刷新状态
                </button>
            </div>

            <!-- 脚本执行 -->
            <div class="card">
                <h2>
                    <span class="card-icon">📜</span>
                    脚本执行
                </h2>
                <select id="script-select" class="select-box">
                    <option value="">加载中...</option>
                </select>
                <button class="primary" style="width: 100%;" onclick="executeScript()">
                    ▶ 执行脚本
                </button>
            </div>

            <!-- 一条龙流程 -->
            <div class="card">
                <h2>
                    <span class="card-icon">🐉</span>
                    一条龙流程
                </h2>
                <select id="onedragon-select" class="select-box">
                    <option value="">加载中...</option>
                </select>
                <button class="primary" style="width: 100%;" onclick="executeOneDragon()">
                    ▶ 执行一条龙
                </button>
            </div>

            <!-- 截图功能 -->
            <div class="card screenshot-container">
                <h2>
                    <span class="card-icon">📸</span>
                    游戏截图
                    <button class="secondary" style="margin-left: auto; padding: 8px 16px;" onclick="captureScreenshot()">
                        刷新截图
                    </button>
                </h2>
                <div class="screenshot-box" id="screenshot-box">
                    <div class="screenshot-placeholder">点击"刷新截图"获取游戏画面</div>
                </div>
            </div>

            <!-- 任务历史 -->
            <div class="card" style="grid-column: 1 / -1;">
                <h2>
                    <span class="card-icon">📋</span>
                    任务历史
                </h2>
                <div class="task-list" id="task-list">
                    <div class="empty-state">
                        <svg fill="currentColor" viewBox="0 0 20 20"><path d="M9 2a1 1 0 000 2h2a1 1 0 100-2H9z"></path><path fill-rule="evenodd" d="M4 5a2 2 0 012-2 3 3 0 003 3h2a3 3 0 003-3 2 2 0 012 2v11a2 2 0 01-2 2H6a2 2 0 01-2-2V5zm3 4a1 1 0 000 2h.01a1 1 0 100-2H7zm3 0a1 1 0 000 2h3a1 1 0 100-2h-3zm-3 4a1 1 0 100 2h.01a1 1 0 100-2H7zm3 0a1 1 0 100 2h3a1 1 0 100-2h-3z" clip-rule="evenodd"></path></svg>
                        <p>暂无任务历史</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = '/admin';
        let refreshInterval;

        function showMessage(text, type) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.className = `message ${type}`;
            msg.style.display = 'block';
            setTimeout(() => {
                msg.style.display = 'none';
            }, 5000);
        }

        function updateStatusBadge(running) {
            const badge = document.getElementById('status-badge');
            if (running) {
                badge.className = 'status-badge running';
                badge.innerHTML = '<span class="status-dot running"></span><span>运行中</span>';
            } else {
                badge.className = 'status-badge stopped';
                badge.innerHTML = '<span class="status-dot stopped"></span><span>已停止</span>';
            }
        }

        async function refreshStatus() {
            try {
                const res = await fetch(`${API_BASE}/status`);
                const data = await res.json();
                updateStatusBadge(data.taskRunning || data.running);
                const badge = document.getElementById('status-badge');
                if (data.taskRunning) {
                    const taskLabel = data.currentTask || '任务执行中';
                    badge.innerHTML = `<span class="status-dot running"></span><span>${taskLabel}</span>`;
                }
            } catch (err) {
                const badge = document.getElementById('status-badge');
                badge.className = 'status-badge loading';
                badge.innerHTML = '<span class="status-dot loading"></span><span>连接失败</span>';
            }
        }

        async function startTask() {
            try {
                const res = await fetch(`${API_BASE}/start`, { method: 'POST' });
                const data = await res.json();
                if (res.ok) {
                    showMessage('任务已启动', 'success');
                    await refreshStatus();
                    await loadTasks();
                } else {
                    showMessage('启动失败: ' + (data.error || '未知错误'), 'error');
                }
            } catch (err) {
                showMessage('启动失败: ' + err.message, 'error');
            }
        }

        async function stopTask() {
            try {
                const res = await fetch(`${API_BASE}/stop`, { method: 'POST' });
                const data = await res.json();
                if (res.ok) {
                    showMessage('任务已停止', 'success');
                    await refreshStatus();
                    await loadTasks();
                } else {
                    showMessage('停止失败: ' + (data.error || '未知错误'), 'error');
                }
            } catch (err) {
                showMessage('停止失败: ' + err.message, 'error');
            }
        }

        async function loadScripts() {
            try {
                const res = await fetch(`${API_BASE}/scripts`);
                const data = await res.json();
                const select = document.getElementById('script-select');

                if (!data.scripts || data.scripts.length === 0) {
                    select.innerHTML = '<option value="">暂无脚本</option>';
                    return;
                }

                select.innerHTML = '<option value="">选择脚本...</option>' +
                    data.scripts.map(s => `<option value="${s.id}">${s.name}${s.projectCount != null ? ' (' + s.projectCount + ')' : ''}</option>`).join('');
            } catch (err) {
                document.getElementById('script-select').innerHTML = '<option value="">加载失败</option>';
            }
        }

        async function executeScript() {
            const scriptId = document.getElementById('script-select').value;
            if (!scriptId) {
                showMessage('请先选择脚本', 'error');
                return;
            }

            try {
                const res = await fetch(`${API_BASE}/script/${scriptId}/start`, { method: 'POST' });
                const data = await res.json();
                if (res.ok) {
                    showMessage(`脚本 ${scriptId} 已启动`, 'success');
                    await loadTasks();
                } else {
                    showMessage('执行失败: ' + (data.error || '未知错误'), 'error');
                }
            } catch (err) {
                showMessage('执行失败: ' + err.message, 'error');
            }
        }

        async function loadOneDragonConfigs() {
            try {
                const res = await fetch(`${API_BASE}/onedragon/configs`);
                const data = await res.json();
                const select = document.getElementById('onedragon-select');

                if (!data.configs || data.configs.length === 0) {
                    select.innerHTML = '<option value="">暂无配置</option>';
                    return;
                }

                select.innerHTML = '<option value="">选择配置...</option>' +
                    data.configs.map(c => `<option value="${c}">${c}</option>`).join('');
            } catch (err) {
                document.getElementById('onedragon-select').innerHTML = '<option value="">加载失败</option>';
            }
        }

        async function executeOneDragon() {
            const configId = document.getElementById('onedragon-select').value;
            if (!configId) {
                showMessage('请先选择配置', 'error');
                return;
            }

            try {
                const res = await fetch(`${API_BASE}/onedragon/execute/${configId}`, { method: 'POST' });
                const data = await res.json();
                if (res.ok) {
                    showMessage(`一条龙 ${configId} 已启动`, 'success');
                    await loadTasks();
                } else {
                    showMessage('执行失败: ' + (data.error || '未知错误'), 'error');
                }
            } catch (err) {
                showMessage('执行失败: ' + err.message, 'error');
            }
        }

        async function captureScreenshot() {
            const box = document.getElementById('screenshot-box');
            box.innerHTML = '<div class="loader"></div>';

            try {
                const res = await fetch(`${API_BASE}/screenshot`);
                const data = await res.json();

                if (res.ok && data.success) {
                    box.innerHTML = `<img src="data:image/png;base64,${data.image}" alt="游戏截图">`;
                } else {
                    box.innerHTML = '<div class="screenshot-placeholder">截图失败: ' + (data.error || '未知错误') + '</div>';
                }
            } catch (err) {
                box.innerHTML = '<div class="screenshot-placeholder">截图失败: ' + err.message + '</div>';
            }
        }

        async function loadTasks() {
            try {
                const res = await fetch(`${API_BASE}/tasks`);
                const data = await res.json();
                const list = document.getElementById('task-list');

                if (!data.tasks || data.tasks.length === 0) {
                    list.innerHTML = `
                        <div class="empty-state">
                            <svg fill="currentColor" viewBox="0 0 20 20"><path d="M9 2a1 1 0 000 2h2a1 1 0 100-2H9z"></path><path fill-rule="evenodd" d="M4 5a2 2 0 012-2 3 3 0 003 3h2a3 3 0 003-3 2 2 0 012 2v11a2 2 0 01-2 2H6a2 2 0 01-2-2V5zm3 4a1 1 0 000 2h.01a1 1 0 100-2H7zm3 0a1 1 0 000 2h3a1 1 0 100-2h-3zm-3 4a1 1 0 100 2h.01a1 1 0 100-2H7zm3 0a1 1 0 100 2h3a1 1 0 100-2h-3z" clip-rule="evenodd"></path></svg>
                            <p>暂无任务历史</p>
                        </div>
                    `;
                    return;
                }

                list.innerHTML = data.tasks.map(task => `
                    <div class="task-item">
                        <div class="task-header">
                            <span class="task-type">${task.Type}</span>
                            <span class="task-status ${task.Status}">${task.Status}</span>
                        </div>
                        <div class="task-time">${new Date(task.CreatedAt).toLocaleString()}</div>
                        ${task.Result ? `<div class="task-result">${task.Result}</div>` : ''}
                    </div>
                `).join('');
            } catch (err) {
                console.error('加载任务失败:', err);
            }
        }

        // 初始化
        async function init() {
            await Promise.all([
                refreshStatus(),
                loadScripts(),
                loadOneDragonConfigs(),
                loadTasks()
            ]);

            // 自动刷新
            refreshInterval = setInterval(() => {
                refreshStatus();
                loadTasks();
            }, 5000);
        }

        init();
    </script>
</body>
</html>
